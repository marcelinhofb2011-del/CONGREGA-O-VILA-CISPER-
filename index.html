<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // HMR is disabled in AI Studio; intercept Vite HMR WebSocket and ignore connection messages
      (function() {
        const OriginalWebSocket = window.WebSocket;

        class PatchedWebSocket extends EventTarget {
          static CONNECTING = 0;
          static OPEN = 1;
          static CLOSING = 2;
          static CLOSED = 3;
          CONNECTING = 0;
          OPEN = 1;
          CLOSING = 2;
          CLOSED = 3;
          readyState = 1; // WebSocket.OPEN
          url = '';
          protocol = 'vite-hmr';
          bufferedAmount = 0;
          binaryType = 'blob';
          onopen = null;
          onclose = null;
          onerror = null;
          onmessage = null;

          constructor(url, protocols) {
            super();
            this.url = String(url || '');
            this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
            setTimeout(() => {
              const openEvt = new Event('open');
              this.dispatchEvent(openEvt);
              try { this.onopen?.(openEvt); } catch (_) {}

              const msgEvt = new MessageEvent('message', {
                data: JSON.stringify({ type: 'connected' })
              });
              this.dispatchEvent(msgEvt);
              try { this.onmessage?.(msgEvt); } catch (_) {}
            }, 0);
          }

          send(data) {
            try {
              const parsed = JSON.parse(data);
              if (parsed?.type === 'ping') {
                setTimeout(() => {
                  const pongEvt = new MessageEvent('message', {
                    data: JSON.stringify({ type: 'pong' })
                  });
                  this.dispatchEvent(pongEvt);
                  try { this.onmessage?.(pongEvt); } catch (_) {}
                }, 10);
              }
            } catch (_) {}
          }

          close() {
            this.readyState = 3;
            const closeEvt = new Event('close');
            this.dispatchEvent(closeEvt);
            try { this.onclose?.(closeEvt); } catch (_) {}
          }
        }

        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr =
              (typeof protocols === 'string' && protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('24678') || url.includes('/@vite')));

            if (isViteHmr) {
              return new PatchedWebSocket(url, protocols);
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = OriginalWebSocket.prototype;
        }

        // Suppress console logs, warnings, and errors related to Vite / WebSocket
        const isViteMessage = function(item) {
          if (!item) return false;
          const str = typeof item === 'string' ? item : (item.message || item.stack || String(item));
          return (
            str.includes('[vite]') ||
            str.includes('vite-hmr') ||
            str.includes('WebSocket') ||
            str.includes('websocket') ||
            str.includes('24678')
          );
        };

        ['log', 'info', 'debug', 'warn', 'error'].forEach(function(method) {
          const orig = console[method];
          if (!orig) return;
          console[method] = function(...args) {
            if (args.some(isViteMessage)) return;
            orig.apply(console, args);
          };
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteMessage(event?.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteMessage(event?.message) || isViteMessage(event?.error)) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        }, true);
      })();
    </script>
